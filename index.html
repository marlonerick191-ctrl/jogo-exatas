el.innerHTML="<table><tr><th>Jogador</th><th>Aula</th><th>Total</th></tr>"+rows.map(r=>"<tr"+(r.me?' class="me"':"")+"><td>"+esc(r.n)+"</td><td>"+(r.a?r.sc:"—")+"</td><td>"+r.t+"</td></tr>").join("")+"</table>"+(rows.length<2?"<small>Esperando outros jogadores…</small>":"");el.style.display="block"}
// ---- códigos de presente (validados no Supabase: função resgatar_codigo)
let rgBusy=0;
async function resgatar(){const i=$("#cod");if(!i||rgBusy||!U)return;const c=i.value.trim().toUpperCase().replace(/\s+/g,"");
if(!c){msg="Digite um código.";return menu("code")}
if(c=="2030"){if(S.own.includes(6))msg="Você já resgatou este código.";else{S.own.push(6);save();msg="Presente resgatado! Skin (???) desbloqueada. Equipe na aba Skins."}return menu("code")}
if(!sb){msg="Sem conexão online: não dá para resgatar agora.";return menu("code")}
rgBusy=1;i.disabled=true;
try{const{data,error}=await sb.rpc("resgatar_codigo",{p_codigo:c,p_usuario:U});if(error)throw error;
if(!data||!data.ok){msg=esc((data&&data.erro)||"Código inválido.")}
else{const t=[];if(data.pontos>0){S.pts+=data.pontos;t.push("+"+data.pontos+" pontos")}
if(data.skin!=null&&SK[data.skin]){if(S.own.includes(data.skin))t.push("skin "+SK[data.skin][0]+" (você já tinha)");else{S.own.push(data.skin);t.push("skin "+SK[data.skin][0])}}
save();msg="Presente resgatado! "+(t.join(" e ")||"")+"."}}
catch(e){console.warn(e);msg="Não consegui falar com o servidor. Tente de novo."}
rgBusy=0;menu("code")}
// ---- contas (salvas neste aparelho)
const AK="exatas3d_contas",SS="exatas3d_sessao";let authNew=0;
const accs=()=>{try{return JSON.parse(localStorage.getItem(AK)||"{}")}catch(e){return{}}};
async function hs(p,s){const d=s+":"+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))>>>0;return"f"+h}
function authScreen(mode,err){const c=mode=="new";authNew=c;open=true;G.on=0;sit=null;U=null;chatOff();["#quiz","#talk","#score"].forEach(i=>$(i).style.display="none");$("#pts").textContent=0;
$("#panel").innerHTML='<h1>Sala de Exatas 3D</h1><p class="m">'+(err||"")+'</p><h3>'+(c?"Criar conta":"Entrar")+'</h3><input id="au" maxlength="14" placeholder="Usuário" autocomplete="username" autocapitalize="none"><input id="ap" type="password" placeholder="Senha" autocomplete="'+(c?"new-password":"current-password")+'" style="margin-top:8px">'+(c?'<input id="ap2" type="password" placeholder="Repita a senha" autocomplete="new-password" style="margin-top:8px">':"")+'<div class="row" style="margin-top:12px"><button class="on" onclick="auth('+c+')">'+(c?"Criar conta":"Entrar")+'</button><button onclick="authScreen(\''+(c?"in":"new")+'\')">'+(c?"Já tenho conta":"Criar conta")+'</button></div><p><small>A conta fica salva só neste aparelho (celular ou computador). Para jogar em outro aparelho, crie a conta lá também.</small></p>';
$("#menu").style.display="flex";if(!TOUCH)setTimeout(()=>$("#au").focus(),0)}
async function auth(c){const md=c?"new":"in",un=$("#au").value.trim(),pw=$("#ap").value,pw2=c?$("#ap2").value:"",k=un.toLowerCase(),a=accs();
if(!/^[A-Za-z0-9_À-ÿ]{3,14}$/.test(un))return authScreen(md,"Usuário: 3 a 14 letras, números ou _ (sem espaço).");
if(pw.length<4)return authScreen(md,"A senha precisa ter pelo menos 4 caracteres.");
if(c){if(a[k])return authScreen(md,"Esse usuário já existe neste aparelho. Escolha outro ou entre.");if(pw!=pw2)return authScreen(md,"As senhas não são iguais.");
const salt=Math.random().toString(36).slice(2,10);a[k]={n:un,s:salt,h:await hs(pw,salt)};
try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){return authScreen(md,"Não consegui salvar a conta: o navegador está bloqueando o armazenamento.")}
if(Object.keys(a).length==1){try{const old=localStorage.getItem("exatas3d");if(old)localStorage.setItem("exatas3d_u_"+k,old)}catch(e){}}
enter(k)}else{const r=a[k];if(!r||r.h!=await hs(pw,r.s))return authScreen(md,"Usuário ou senha incorretos.");enter(k)}}
function enter(k){const r=accs()[k];U=k;S={pts:0,own:[0],skin:0,rec:[],name:r.n};try{Object.assign(S,JSON.parse(localStorage.getItem("exatas3d_u_"+k)||"{}"))}catch(e){}S.name=r.n;if(S.tot===undefined)S.tot=S.pts;try{localStorage.setItem(SS,k)}catch(e){}skinApply();sendPlacar();msg="Bem-vindo, "+r.n+"!";menu("play")}
function logout(){try{localStorage.removeItem(SS)}catch(e){}authScreen("in")}
function boot(){$("#panel").addEventListener("keydown",e=>{if(e.key=="Enter"&&$("#au"))auth(authNew);if(e.key=="Enter"&&$("#cod"))resgatar()});let k=null;try{k=localStorage.getItem(SS)}catch(e){}
if(k&&accs()[k])enter(k);else authScreen(Object.keys(accs()).length?"in":"new")}
// ---- chat (broadcast do Supabase, sem banco: as mensagens não ficam salvas)
const CH_MAX=200;let chOpen=0,chUnread=0,chLast=0;
function chatAdd(n,m,me,sys){const box=$("#cmsgs");if(!box)return;const d=document.createElement("div");if(me)d.className="me";if(sys)d.className="sys";
if(sys)d.textContent=m;else{const t=document.createElement("time"),b=document.createElement("b"),s=document.createElement("span"),dt=new Date();t.textContent=String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");b.textContent=n+": ";s.textContent=m;d.append(t,b,s)}
const near=box.scrollHeight-box.scrollTop-box.clientHeight<60;box.appendChild(d);while(box.children.length>60)box.removeChild(box.firstChild);if(near||me)box.scrollTop=box.scrollHeight;
if(!me&&!sys&&!chOpen){chUnread++;const c=$("#cbadge");c.textContent=chUnread>9?"9+":chUnread;c.style.display="inline"}}
function onChat(e){const p=e&&e.payload;if(!p||typeof p.m!="string"||typeof p.n!="string"||p.id===myId)return;const m=p.m.trim().slice(0,CH_MAX);if(!m)return;chatAdd(p.n.slice(0,14)||"Aluno",m,0,0)}
function chatSend(){const i=$("#chatin"),m=i.value.trim().slice(0,CH_MAX);if(!m||!U)return;const t=Date.now();if(t-chLast<800)return;
if(!ch||!live){chatAdd("","Sem conexão online: a mensagem não foi enviada.",0,1);return}
chLast=t;i.value="";chatAdd(S.name||"Aluno",m,1,0);try{ch.send({type:"broadcast",event:"chat",payload:{id:myId,n:S.name||"Aluno",m}})}catch(e){console.warn(e)}}
function chatToggle(f){chOpen=f===undefined?!chOpen:!!f;$("#chat").style.display=chOpen?"flex":"none";
if(chOpen){chUnread=0;$("#cbadge").style.display="none";const b=$("#cmsgs");b.scrollTop=b.scrollHeight;if(!TOUCH)setTimeout(()=>$("#chatin").focus(),0)}else $("#chatin").blur()}
function chatOff(){chatToggle(0);$("#cmsgs").textContent="";chUnread=0}
$("#jump").addEventListener("pointerdown",e=>{e.preventDefault();jt=performance.now()});$("#jump").addEventListener("contextmenu",e=>e.preventDefault());
$("#chatin").addEventListener("focus",()=>{for(const k in keys)keys[k]=0});
boot();connect();window.__ok=1;
</script></body></html>
